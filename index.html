<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RevAlpha Script Converter</title>

<link rel="stylesheet" href="style.css">

<script src="mapping.js"></script>
<script src="script.js"></script>

</head>
<body>

<div class="container">

<h1>RevAlpha Script Converter</h1>

<p>Enter text below:</p>

<textarea id="inputText" placeholder="Type English or RevAlpha text here..."></textarea>

<div class="buttons">
<button class="convert" onclick="convertText()">Convert</button>
<button class="clear" onclick="clearText()">Clear</button>
</div>

<p>Converted Text:</p>

<textarea id="outputText" readonly></textarea>



</div>

</body>
